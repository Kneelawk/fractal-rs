[package]
name = "fractal-rs-3-gen-api"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
downcast-rs = "2"
futures-core = "0.3"
lazy_static = "1.5"
num-traits = "0.2"
regex = "1.11"
rug = { version = "1.27", features = ["num-traits", "serde"] }
serde = { version = "1", features = ["derive"] }
streaming-iterator = "0.1"
