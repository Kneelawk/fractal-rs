[package]
name = "fractal-rs-3-gen-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
anymap = "1.0.0-beta.2"
dyn-clone = "1.0.18"
futures = "0.3.31"
futures-core = "0.3"
lazy_static = "1.5"
num-traits = "0.2"
regex = "1.11"
rug = { version = "1.27", features = ["num-traits", "serde"] }
serde = { version = "1", features = ["derive"] }
streaming-iterator = "0.1"
tokio = { version = "1.43", features = ["sync"] }
